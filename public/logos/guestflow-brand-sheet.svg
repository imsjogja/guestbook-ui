<svg viewBox="0 0 900 720" xmlns="http://www.w3.org/2000/svg" font-family="'Poppins','Segoe UI',system-ui,Arial,sans-serif">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12786E"/>
      <stop offset="1" stop-color="#34D8C4"/>
    </linearGradient>
    <linearGradient id="tealH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12786E"/>
      <stop offset="1" stop-color="#34D8C4"/>
    </linearGradient>
  </defs>

  <rect width="900" height="720" fill="#FFFFFF"/>

  <text x="40" y="60" font-size="26" font-weight="700" fill="#0F172A">guestflow.id — Brand Sheet</text>
  <text x="40" y="86" font-size="15" fill="#64748B">Konsep Flow · palet teal segar</text>
  <line x1="40" y1="106" x2="860" y2="106" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Primary lockup -->
  <g transform="translate(250,140)">
    <g transform="translate(0,0) scale(0.92)">
      <rect width="100" height="100" rx="26" fill="url(#teal)"/>
      <path d="M28,72 C40,66 44,54 50,50 C56,46 60,34 72,28" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <circle cx="28" cy="72" r="6.6" fill="#FFFFFF"/>
      <circle cx="50" cy="50" r="7.6" fill="#FFFFFF"/>
      <circle cx="72" cy="28" r="8.8" fill="#FFFFFF"/>
    </g>
    <text x="122" y="72" font-size="52" font-weight="700" letter-spacing="-0.5"><tspan fill="#14332F">guest</tspan><tspan fill="url(#teal)">flow</tspan><tspan fill="#AFD5CE" font-size="37">.id</tspan></text>
  </g>

  <!-- Tiles -->
  <!-- Tile 1: icon -->
  <g transform="translate(40,290)">
    <rect width="260" height="210" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <g transform="translate(82,40) scale(0.96)">
      <rect width="100" height="100" rx="24" fill="url(#teal)"/>
      <path d="M28,72 C40,66 44,54 50,50 C56,46 60,34 72,28" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <circle cx="28" cy="72" r="6.6" fill="#FFFFFF"/>
      <circle cx="50" cy="50" r="7.6" fill="#FFFFFF"/>
      <circle cx="72" cy="28" r="8.8" fill="#FFFFFF"/>
    </g>
    <text x="130" y="180" font-size="14" fill="#94A3B8" font-weight="600" text-anchor="middle" letter-spacing="1">Ikon / App icon</text>
  </g>

  <!-- Tile 2: stacked -->
  <g transform="translate(320,290)">
    <rect width="260" height="210" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <g transform="translate(98,34) scale(0.64)">
      <rect width="100" height="100" rx="24" fill="url(#teal)"/>
      <path d="M28,72 C40,66 44,54 50,50 C56,46 60,34 72,28" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <circle cx="28" cy="72" r="6.6" fill="#FFFFFF"/>
      <circle cx="50" cy="50" r="7.6" fill="#FFFFFF"/>
      <circle cx="72" cy="28" r="8.8" fill="#FFFFFF"/>
    </g>
    <text x="130" y="132" font-size="27" font-weight="700" text-anchor="middle" letter-spacing="-0.3"><tspan fill="#14332F">guest</tspan><tspan fill="url(#teal)">flow</tspan></text>
    <text x="130" y="180" font-size="14" fill="#94A3B8" font-weight="600" text-anchor="middle" letter-spacing="1">Versi vertikal</text>
  </g>

  <!-- Tile 3: dark -->
  <g transform="translate(600,290)">
    <rect width="260" height="210" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="20" y="20" width="220" height="130" rx="14" fill="#0C2925"/>
    <g transform="translate(48,52) scale(0.46)">
      <rect width="100" height="100" rx="24" fill="url(#teal)"/>
      <path d="M28,72 C40,66 44,54 50,50 C56,46 60,34 72,28" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <circle cx="28" cy="72" r="6.6" fill="#FFFFFF"/>
      <circle cx="50" cy="50" r="7.6" fill="#FFFFFF"/>
      <circle cx="72" cy="28" r="8.8" fill="#FFFFFF"/>
    </g>
    <text x="100" y="93" font-size="25" font-weight="700" letter-spacing="-0.3"><tspan fill="#FFFFFF">guest</tspan><tspan fill="url(#teal)">flow</tspan></text>
    <text x="130" y="180" font-size="14" fill="#94A3B8" font-weight="600" text-anchor="middle" letter-spacing="1">Background gelap</text>
  </g>

  <!-- Palette -->
  <text x="40" y="560" font-size="15" font-weight="700" fill="#334155">Palet warna</text>
  <rect x="40" y="576" width="300" height="56" rx="12" fill="url(#tealH)"/>
  <text x="52" y="600" font-size="14" font-weight="700" fill="#FFFFFF">#12786E</text>
  <text x="270" y="600" font-size="14" font-weight="700" fill="#0F3D37" text-anchor="end">#34D8C4</text>
  <text x="190" y="620" font-size="12" fill="#FFFFFF" text-anchor="middle" opacity="0.9">Gradasi utama</text>

  <rect x="360" y="576" width="120" height="56" rx="12" fill="#14332F"/>
  <text x="420" y="600" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">#14332F</text>
  <text x="420" y="620" font-size="12" fill="#CBD5E1" text-anchor="middle">Teks</text>

  <rect x="500" y="576" width="120" height="56" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="560" y="600" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">#FFFFFF</text>
  <text x="560" y="620" font-size="12" fill="#94A3B8" text-anchor="middle">Ikon dalam</text>
</svg>
